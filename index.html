<body class="bg-slate-50">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ── CONSTANTS ────────────────────────────────────────────────────────────────
const MONTHS_TO_WEEKS = 4.33;
const INTEGRATION_HUB_COST = 20000;
const TEAMS = ["Care","Content","SSO","CDP","CRM"];
const CURRENCIES = ["EUR","USD","GBP"];
const CURRENCY_SYMBOLS = { EUR:"€", USD:"$", GBP:"£" };
const DURATION_UNITS = ["weeks","months"];
const ROLES = [
  "Business Analyst","Scrum Master","Product Owner","Project Manager",
  "Software Engineer","Front-End Engineer","Back-End Engineer","Full-Stack Engineer",
  "Salesforce Engineer","QA Engineer","Test Automation Engineer","DevOps Engineer",
  "Data Engineer","Solution Architect","Technical Architect","Enterprise Architect",
  "UX/UI Designer","Data Analyst","Data Scientist","Security Specialist",
  "Release Manager","Change Manager","Technical Writer","Other",
];

// Mars Petcare brand colors for Excel
const MARS_BLUE  = "00008B";
const MARS_RED   = "CC0000";
const MARS_LIGHT = "E8EEF7";
const MARS_DARK  = "000066";
const WHITE      = "FFFFFF";
const LIGHT_GREY = "F5F5F5";
const MID_GREY   = "E0E0E0";

// ── CALCULATIONS ─────────────────────────────────────────────────────────────
function toWeeks(value, unit) {
  const v = parseFloat(value) || 0;
  return unit === "months" ? v * MONTHS_TO_WEEKS : v;
}
function calcResource(resource, projectWeeks) {
  const weeks = resource.useCustomDuration
    ? toWeeks(resource.durationValue, resource.durationUnit)
    : projectWeeks;
  const hoursPerResource = (resource.hoursPerWeek || 0) * weeks;
  const totalHours       = (resource.quantity || 0) * hoursPerResource;
  const costPerPerson    = (resource.hourlyRate || 0) * hoursPerResource;
  const totalCost        = (resource.quantity || 0) * costPerPerson;
  return { weeks, hoursPerResource, totalHours, costPerPerson, totalCost };
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
let _id = 0;
function genId() { return `r_${Date.now()}_${_id++}`; }
function fmt(n, currency) {
  const sym = CURRENCY_SYMBOLS[currency] || currency;
  return `${sym}${Number(n||0).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
}
function fmtNum(n) { return Number(n||0).toLocaleString("en-GB"); }
function sanitize(name) { return name.replace(/[\\/:*?"<>|]/g,"_").trim()||"Project"; }

// ── VALIDATION ────────────────────────────────────────────────────────────────
function validate(project, resources) {
  const e = [];
  if (!project.projectName.trim()) e.push("Project name is required.");
  if (!project.team) e.push("Team selection is required.");
  if (resources.length === 0) e.push("At least one resource must be added.");
  resources.forEach((r,i) => {
    const l = `Resource ${i+1}`;
    if (!r.role) e.push(`${l}: role is required.`);
    if (r.role==="Other" && !r.customRole?.trim()) e.push(`${l}: custom role description is required.`);
    const rate = parseFloat(r.hourlyRate);
    if (r.hourlyRate===""||r.hourlyRate===undefined||r.hourlyRate===null) e.push(`${l}: hourly rate is required.`);
    else if (isNaN(rate)||rate<0) e.push(`${l}: hourly rate must be a non-negative number.`);
    if (!r.hoursPerWeek||r.hoursPerWeek<=0) e.push(`${l}: hours per week must be > 0.`);
    if (r.hoursPerWeek>168) e.push(`${l}: hours per week cannot exceed 168.`);
    if (r.useCustomDuration&&(!r.durationValue||r.durationValue<=0)) e.push(`${l}: custom duration must be > 0.`);
  });
  return e;
}

// ── EXCEL EXPORT ──────────────────────────────────────────────────────────────
function cellStyle(bold=false, bg=null, color=null, sz=11, align="left", border=false) {
  const s = { font:{ name:"Calibri", sz, bold, color: color?{rgb:color}:undefined },
              alignment:{ horizontal:align, vertical:"center", wrapText:true } };
  if (bg) s.fill = { patternType:"solid", fgColor:{ rgb:bg } };
  if (border) s.border = {
    top:{style:"thin",color:{rgb:"CCCCCC"}}, bottom:{style:"thin",color:{rgb:"CCCCCC"}},
    left:{style:"thin",color:{rgb:"CCCCCC"}}, right:{style:"thin",color:{rgb:"CCCCCC"}}
  };
  return s;
}

function applyStyle(ws, ref, style) {
  if (!ws[ref]) ws[ref] = { t:"z", v:"" };
  ws[ref].s = style;
}

function exportToExcel(project, resources, integrationHub) {
  const wb = XLSX.utils.book_new();
  const projectWeeks = toWeeks(project.durationValue, project.durationUnit);
  const sym = CURRENCY_SYMBOLS[project.currency] || project.currency;
  const today = new Date().toISOString().slice(0,10);

  const totalHeadcount = resources.reduce((s,r) => s+(r.quantity||0), 0);
  const totalHours     = resources.reduce((s,r) => s+calcResource(r,projectWeeks).totalHours, 0);
  const resourceCost   = resources.reduce((s,r) => s+calcResource(r,projectWeeks).totalCost, 0);
  const integrationCost = integrationHub ? INTEGRATION_HUB_COST : 0;
  const totalCost      = resourceCost + integrationCost;

  // ━━ SHEET 1: Executive Summary ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const S = [
    ["Mars Petcare – Resource Budget Estimation",""],
    [`Initiative: ${project.projectName || "—"}  |  Team: ${project.team || "—"}  |  Generated: ${today}`,""],
    ["",""],
    ["PROJECT INFORMATION",""],
    ["Project / Initiative Name", project.projectName || "—"],
    ["Team", project.team || "—"],
    ["Vendor / Delivery Partner", project.vendorName || "—"],
    ["Start Date", project.startDate || "—"],
    ["Currency", project.currency],
    ["Description", project.description || "—"],
    ["",""],
    ["PROJECT SCOPE",""],
    ["Project Duration", `${project.durationValue} ${project.durationUnit} (${projectWeeks.toFixed(2)} weeks)`],
    ["Number of Resource Roles", resources.length],
    ["Total Headcount", totalHeadcount],
    ["Total Estimated Hours", parseFloat(totalHours.toFixed(2))],
    ["",""],
    ["COST SUMMARY",""],
    ["Resource Costs", parseFloat(resourceCost.toFixed(2))],
    ["Integration Hub (standard estimate)", integrationHub ? parseFloat(integrationCost.toFixed(2)) : "Not included"],
    ["TOTAL ESTIMATED COST", parseFloat(totalCost.toFixed(2))],
    ["",""],
    ["DISCLAIMER",""],
    ["This estimation was created using the Mars Petcare Resource Budget Builder. It represents a preliminary estimate based on manually entered rates and assumptions. Figures should be validated before formal financial approval.",""],
    ["",""],
    ["Budget generated on", today],
  ];
  const ws1 = XLSX.utils.aoa_to_sheet(S);

  // Style sheet 1
  // Title row
  ws1["A1"] = { v:S[0][0], t:"s", s:{ font:{name:"Calibri",sz:18,bold:true,color:{rgb:WHITE}},
    fill:{patternType:"solid",fgColor:{rgb:MARS_BLUE}}, alignment:{horizontal:"left",vertical:"center"} } };
  ws1["B1"] = { v:"", t:"s", s:{ fill:{patternType:"solid",fgColor:{rgb:MARS_BLUE}} } };
  // Subtitle row
  ws1["A2"] = { v:S[1][0], t:"s", s:{ font:{name:"Calibri",sz:10,bold:false,color:{rgb:WHITE}},
    fill:{patternType:"solid",fgColor:{rgb:MARS_DARK}}, alignment:{horizontal:"left",vertical:"center"} } };
  ws1["B2"] = { v:"", t:"s", s:{ fill:{patternType:"solid",fgColor:{rgb:MARS_DARK}} } };

  // Section headers rows 4,12,18,23
  [4,12,18,23].forEach(r => {
    const ref = `A${r}`;
    if (ws1[ref]) ws1[ref].s = { font:{name:"Calibri",sz:11,bold:true,color:{rgb:WHITE}},
      fill:{patternType:"solid",fgColor:{rgb:MARS_BLUE}}, alignment:{horizontal:"left",vertical:"center"} };
    const ref2 = `B${r}`;
    if (!ws1[ref2]) ws1[ref2] = {v:"",t:"s"};
    ws1[ref2].s = { fill:{patternType:"solid",fgColor:{rgb:MARS_BLUE}} };
  });

  // Total cost row (row 21) — big red highlight
  ws1["A21"] = { v:"TOTAL ESTIMATED COST", t:"s", s:{ font:{name:"Calibri",sz:13,bold:true,color:{rgb:WHITE}},
    fill:{patternType:"solid",fgColor:{rgb:MARS_RED}}, alignment:{horizontal:"left",vertical:"center"} } };
  ws1["B21"] = { v:parseFloat(totalCost.toFixed(2)), t:"n",
    z:`"${sym}"#,##0.00`,
    s:{ font:{name:"Calibri",sz:13,bold:true,color:{rgb:WHITE}},
      fill:{patternType:"solid",fgColor:{rgb:MARS_RED}}, alignment:{horizontal:"right",vertical:"center"} } };

  // Currency format for cost rows
  [19,20].forEach(r => {
    const ref = `B${r}`;
    if (ws1[ref] && typeof ws1[ref].v === "number") ws1[ref].z = `"${sym}"#,##0.00`;
  });

  ws1["!cols"] = [{wch:38},{wch:52}];
  ws1["!rows"] = [{hpt:32},{hpt:18},...Array(30).fill({hpt:18})];
  ws1["!merges"] = [{s:{r:23,c:0},e:{r:23,c:1}}]; // disclaimer spans both cols
  XLSX.utils.book_append_sheet(wb, ws1, "Executive Summary");

  // ━━ SHEET 2: Resource Breakdown ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const headers = [
    "#","Resource Role","Custom Role","People","Hourly Rate","Currency",
    "Hrs/Week","Duration Value","Duration Unit","Duration (Wks)",
    "Hrs/Person","Total Hours","Cost/Person","Total Role Cost","Notes"
  ];
  const dataRows = resources.map((r,i) => {
    const c = calcResource(r, projectWeeks);
    const dv = r.useCustomDuration ? r.durationValue : project.durationValue;
    const du = r.useCustomDuration ? r.durationUnit  : project.durationUnit;
    return [
      i+1,
      r.role==="Other" ? "Other" : r.role,
      r.role==="Other" ? (r.customRole||"") : "",
      r.quantity,
      parseFloat((r.hourlyRate||0)),
      project.currency,
      r.hoursPerWeek,
      parseFloat(dv),
      du,
      parseFloat(c.weeks.toFixed(2)),
      parseFloat(c.hoursPerResource.toFixed(2)),
      parseFloat(c.totalHours.toFixed(2)),
      parseFloat(c.costPerPerson.toFixed(2)),
      parseFloat(c.totalCost.toFixed(2)),
      r.notes||"",
    ];
  });

  // Integration hub row
  const integRow = integrationHub
    ? ["","Integration Hub (Standard Estimate)","",1,"","",
       "","","","","","","",(parseFloat(integrationCost.toFixed(2))),"Standard €20k estimate – pending discovery"]
    : null;

  const totalsRow = [
    "","TOTALS","",totalHeadcount,"","","","","","",
    "",parseFloat(totalHours.toFixed(2)),"",parseFloat(totalCost.toFixed(2)),""
  ];

  const allRows = [headers, ...dataRows];
  if (integRow) allRows.push(integRow);
  allRows.push([]);
  allRows.push(totalsRow);

  const ws2 = XLSX.utils.aoa_to_sheet(allRows);

  // Style header row
  headers.forEach((_,ci) => {
    const ref = XLSX.utils.encode_cell({r:0,c:ci});
    if (!ws2[ref]) ws2[ref] = {v:headers[ci],t:"s"};
    ws2[ref].s = { font:{name:"Calibri",sz:11,bold:true,color:{rgb:WHITE}},
      fill:{patternType:"solid",fgColor:{rgb:MARS_BLUE}},
      alignment:{horizontal:"center",vertical:"center"},
      border:{bottom:{style:"medium",color:{rgb:MARS_RED}}} };
  });

  // Alternate row shading + currency format
  const numCols = [4,10,11,12,13]; // hourly rate, hrs/person, total hrs, cost/person, total cost
  dataRows.forEach((_,ri) => {
    const rowIdx = ri+1;
    const bg = ri%2===0 ? LIGHT_GREY : WHITE;
    headers.forEach((_2,ci) => {
      const ref = XLSX.utils.encode_cell({r:rowIdx,c:ci});
      if (!ws2[ref]) ws2[ref] = {v:"",t:"s"};
      ws2[ref].s = { font:{name:"Calibri",sz:10}, fill:{patternType:"solid",fgColor:{rgb:bg}},
        alignment:{horizontal:ci===1||ci===2||ci===14?"left":"center",vertical:"center"},
        border:{top:{style:"thin",color:{rgb:MID_GREY}},bottom:{style:"thin",color:{rgb:MID_GREY}},
                left:{style:"thin",color:{rgb:MID_GREY}},right:{style:"thin",color:{rgb:MID_GREY}}} };
      if (numCols.includes(ci) && typeof ws2[ref].v==="number") ws2[ref].z = `"${sym}"#,##0.00`;
    });
  });

  // Integration hub row style (if present)
  if (integRow) {
    const rowIdx = dataRows.length + 1;
    headers.forEach((_,ci) => {
      const ref = XLSX.utils.encode_cell({r:rowIdx,c:ci});
      if (!ws2[ref]) ws2[ref] = {v:"",t:"s"};
      ws2[ref].s = { font:{name:"Calibri",sz:10,italic:true},
        fill:{patternType:"solid",fgColor:{rgb:"FFF3E0"}},
        alignment:{horizontal:ci===1||ci===14?"left":"center",vertical:"center"},
        border:{top:{style:"thin",color:{rgb:MID_GREY}},bottom:{style:"thin",color:{rgb:MID_GREY}},
                left:{style:"thin",color:{rgb:MID_GREY}},right:{style:"thin",color:{rgb:MID_GREY}}} };
      if (ci===13 && typeof ws2[ref].v==="number") ws2[ref].z = `"${sym}"#,##0.00`;
    });
  }

  // Totals row
  const totRowIdx = allRows.length - 1;
  headers.forEach((_,ci) => {
    const ref = XLSX.utils.encode_cell({r:totRowIdx,c:ci});
    if (!ws2[ref]) ws2[ref] = {v:"",t:"s"};
    ws2[ref].s = { font:{name:"Calibri",sz:11,bold:true,color:{rgb:WHITE}},
      fill:{patternType:"solid",fgColor:{rgb:MARS_BLUE}},
      alignment:{horizontal:ci===1?"left":"center",vertical:"center"},
      border:{top:{style:"medium",color:{rgb:MARS_RED}}} };
    if ([11,13].includes(ci) && typeof ws2[ref].v==="number") ws2[ref].z = `"${sym}"#,##0.00`;
  });

  ws2["!cols"] = [{wch:4},{wch:24},{wch:18},{wch:8},{wch:12},{wch:9},{wch:10},
                  {wch:13},{wch:12},{wch:13},{wch:12},{wch:12},{wch:14},{wch:15},{wch:32}];
  ws2["!autofilter"] = { ref:`A1:O1` };
  XLSX.utils.book_append_sheet(wb, ws2, "Resource Breakdown");

  // ━━ SHEET 3: Assumptions ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const A3 = [
    ["Mars Petcare – Budget Assumptions & Methodology",""],
    ["",""],
    ["ASSUMPTION","DETAIL"],
    ["Month definition","1 month = 4.33 weeks (365 days ÷ 12 months ÷ 7 days)"],
    ["Hourly rates","Based on vendor quotations or internal rate cards entered manually"],
    ["Taxes","Costs exclude taxes unless already included in the entered rate"],
    ["Other expenses","Costs exclude travel, licences, infrastructure, and contingency"],
    ["Integration Hub","Standard €20k estimate applies when Integration Hub team is flagged as required. This is a placeholder pending proper product discovery."],
    ["Validation","All figures are preliminary estimates and must be validated before financial approval"],
    ["",""],
    ["FORMULA REFERENCE",""],
    ["Resource Weeks","= Duration converted to weeks (months × 4.33)"],
    ["Hours per Resource","= Hours per Week × Resource Weeks"],
    ["Total Resource Hours","= Number of People × Hours per Resource"],
    ["Cost per Person","= Hourly Rate × Hours per Resource"],
    ["Total Role Cost","= Number of People × Hourly Rate × Hours per Week × Resource Weeks"],
    ["Total Project Cost","= Sum of all Total Role Costs + Integration Hub cost (if applicable)"],
    ["",""],
    ["Generated by","Mars Petcare Resource Budget Builder"],
    ["Generated on", today],
  ];
  const ws3 = XLSX.utils.aoa_to_sheet(A3);
  ws3["A1"] = { v:A3[0][0], t:"s", s:{ font:{name:"Calibri",sz:14,bold:true,color:{rgb:WHITE}},
    fill:{patternType:"solid",fgColor:{rgb:MARS_BLUE}}, alignment:{horizontal:"left",vertical:"center"} } };
  ws3["B1"] = { v:"", t:"s", s:{ fill:{patternType:"solid",fgColor:{rgb:MARS_BLUE}} } };
  ["A3","A11"].forEach(ref => {
    if (ws3[ref]) ws3[ref].s = { font:{name:"Calibri",sz:11,bold:true,color:{rgb:WHITE}},
      fill:{patternType:"solid",fgColor:{rgb:MARS_BLUE}} };
    const bref = ref.replace("A","B");
    if (!ws3[bref]) ws3[bref]={v:"",t:"s"};
    ws3[bref].s = { fill:{patternType:"solid",fgColor:{rgb:MARS_BLUE}} };
  });
  ws3["!cols"] = [{wch:28},{wch:70}];
  ws3["!rows"] = [{hpt:28},...Array(20).fill({hpt:18})];
  XLSX.utils.book_append_sheet(wb, ws3, "Assumptions");

  const filename = `${sanitize(project.projectName)}_Resource_Budget_${today}.xlsx`;
  XLSX.writeFile(wb, filename);
  return filename;
}

// ── DEFAULT STATE ─────────────────────────────────────────────────────────────
const defaultProject = {
  projectName:"",team:"",vendorName:"",startDate:"",description:"",
  currency:"EUR",durationValue:3,durationUnit:"months"
};
function defaultResource() {
  return { id:genId(),role:"",customRole:"",quantity:1,hourlyRate:"",
    hoursPerWeek:40,useCustomDuration:false,durationValue:1,durationUnit:"months",notes:"" };
}

// ── UI PRIMITIVES ─────────────────────────────────────────────────────────────
function Label({ children, required }) {
  return (
    <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">
      {children}{required && <span className="text-red-600 ml-0.5">*</span>}
    </label>
  );
}
function Inp({ className="", ...p }) {
  return <input className={`w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-800 shadow-sm placeholder:text-slate-400 focus:border-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-100 transition ${className}`} {...p} />;
}
function Sel({ className="", children, ...p }) {
  return <select className={`w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-800 shadow-sm focus:border-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-100 transition ${className}`} {...p}>{children}</select>;
}
function Txta({ className="", rows=3, ...p }) {
  return <textarea className={`w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-800 shadow-sm placeholder:text-slate-400 focus:border-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-100 transition resize-none ${className}`} rows={rows} {...p} />;
}
function Card({ children, className="" }) {
  return <div className={`bg-white rounded-2xl border border-slate-100 shadow-sm p-6 ${className}`}>{children}</div>;
}
function SectionTitle({ children, sub }) {
  return (
    <div className="mb-5">
      <h2 className="text-base font-bold text-slate-800 tracking-tight">{children}</h2>
      {sub && <p className="text-xs text-slate-500 mt-0.5">{sub}</p>}
    </div>
  );
}
function IconBtn({ onClick, title, children, danger=false }) {
  return <button onClick={onClick} title={title}
    className={`p-1.5 rounded-lg transition ${danger?"text-red-400 hover:bg-red-50 hover:text-red-600":"text-slate-400 hover:bg-slate-100 hover:text-slate-600"}`}>{children}</button>;
}

// Toggle switch component
function Toggle({ checked, onChange, label, sublabel }) {
  return (
    <div className="flex items-start gap-3">
      <button
        onClick={() => onChange(!checked)}
        className={`relative flex-shrink-0 mt-0.5 w-11 h-6 rounded-full transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-800 focus:ring-offset-2 ${checked ? "bg-mars-blue" : "bg-slate-300"}`}
        style={{background: checked ? "#00008B" : "#CBD5E1"}}
        role="switch" aria-checked={checked}
      >
        <span className={`absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform duration-200 ${checked ? "translate-x-5" : "translate-x-0"}`} />
      </button>
      <div>
        <p className="text-sm font-semibold text-slate-800">{label}</p>
        {sublabel && <p className="text-xs text-slate-500 mt-0.5 leading-relaxed">{sublabel}</p>}
      </div>
    </div>
  );
}

// Mars Petcare logo (SVG recreation — dark blue MARS, red Petcare)
function MarsLogo({ size="sm" }) {
  const scale = size === "sm" ? 1 : 1.4;
  return (
    <div style={{lineHeight:1, userSelect:"none"}}>
      <div style={{fontFamily:"Arial Black, Arial, sans-serif", fontWeight:900,
        fontSize: size==="sm" ? "18px" : "26px", color:"#00008B", letterSpacing:"-0.5px", lineHeight:1}}>
        MARS
      </div>
      <div style={{fontFamily:"Arial, sans-serif", fontWeight:700,
        fontSize: size==="sm" ? "10px" : "14px", color:"#CC0000", letterSpacing:"1.5px",
        textTransform:"uppercase", lineHeight:1, marginTop:"1px"}}>
        Petcare
      </div>
    </div>
  );
}

// SVG icons
const IcoPlus  = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>;
const IcoTrash = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>;
const IcoCopy  = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>;
const IcoDl    = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>;
const IcoReset = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>;
const IcoChev  = ({open}) => <svg className={`w-4 h-4 transition-transform ${open?"rotate-180":""}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7"/></svg>;
const IcoCheck = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>;
const IcoInfo  = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;

// ── RESOURCE ROW ──────────────────────────────────────────────────────────────
function ResourceRow({ resource, index, projectWeeks, currency, onUpdate, onDuplicate, onDelete }) {
  const [expanded, setExpanded] = useState(true);
  const [confirmDel, setConfirmDel] = useState(false);
  const calc = calcResource(resource, projectWeeks);
  function upd(f,v) { onUpdate({...resource,[f]:v}); }
  const roleLabel = resource.role==="Other" && resource.customRole
    ? resource.customRole
    : resource.role || <span className="text-slate-400 italic text-xs">No role selected</span>;

  return (
    <div className="border border-slate-200 rounded-xl overflow-hidden bg-white shadow-sm">
      <div className="flex items-center gap-3 px-4 py-3 bg-slate-50 cursor-pointer select-none hover:bg-slate-100 transition"
        onClick={() => setExpanded(e=>!e)}>
        <span className="flex-shrink-0 w-6 h-6 rounded-full text-white text-xs font-bold flex items-center justify-center leading-none" style={{background:"#00008B"}}>{index+1}</span>
        <div className="flex-1 min-w-0">
          <p className="text-sm font-semibold text-slate-800 truncate">{roleLabel}</p>
          <p className="text-xs text-slate-500">
            {resource.quantity>1?`${resource.quantity} people · `:""}{fmtNum(Math.round(calc.totalHours))} hrs · <strong className="text-slate-700">{fmt(calc.totalCost,currency)}</strong>
          </p>
        </div>
        <div className="flex items-center gap-1" onClick={e=>e.stopPropagation()}>
          <IconBtn onClick={onDuplicate} title="Duplicate"><IcoCopy/></IconBtn>
          {confirmDel ? (
            <div className="flex items-center gap-1">
              <button onClick={onDelete} className="text-xs text-white px-2 py-1 rounded-lg font-medium transition" style={{background:"#CC0000"}}>Delete</button>
              <button onClick={()=>setConfirmDel(false)} className="text-xs text-slate-500 hover:text-slate-700 px-2 py-1 transition">Cancel</button>
            </div>
          ) : (
            <IconBtn onClick={()=>setConfirmDel(true)} title="Delete" danger><IcoTrash/></IconBtn>
          )}
        </div>
        <IcoChev open={expanded}/>
      </div>
      {expanded && (
        <div className="p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <div>
            <Label required>Resource Role</Label>
            <Sel value={resource.role} onChange={e=>upd("role",e.target.value)}>
              <option value="">— Select role —</option>
              {ROLES.map(r=><option key={r}>{r}</option>)}
            </Sel>
          </div>
          {resource.role==="Other" && (
            <div>
              <Label required>Custom Role Name</Label>
              <Inp type="text" value={resource.customRole} onChange={e=>upd("customRole",e.target.value)} placeholder="e.g. Integration Specialist"/>
            </div>
          )}
          <div>
            <Label required>Number of People</Label>
            <Inp type="number" min={1} value={resource.quantity} onChange={e=>upd("quantity",Math.max(1,parseInt(e.target.value)||1))}/>
          </div>
          <div>
            <Label required>Hourly Rate ({currency})</Label>
            <Inp type="number" min={0} step="0.01" value={resource.hourlyRate}
              onChange={e=>upd("hourlyRate",e.target.value===""?"":parseFloat(e.target.value))} placeholder="0.00"/>
          </div>
          <div>
            <Label required>Hours per Week / Person</Label>
            <Inp type="number" min={1} max={168} value={resource.hoursPerWeek}
              onChange={e=>upd("hoursPerWeek",Math.min(168,Math.max(0,parseInt(e.target.value)||0)))}/>
          </div>
          <div className="sm:col-span-2 lg:col-span-3">
            <label className="flex items-center gap-2 cursor-pointer select-none w-fit">
              <input type="checkbox" checked={resource.useCustomDuration} onChange={e=>upd("useCustomDuration",e.target.checked)}
                className="w-4 h-4 rounded border-slate-300 focus:ring-blue-800" style={{accentColor:"#00008B"}}/>
              <span className="text-sm text-slate-600">Use a different duration for this resource</span>
            </label>
          </div>
          {resource.useCustomDuration && (
            <>
              <div>
                <Label required>Duration</Label>
                <Inp type="number" min={0.5} step="0.5" value={resource.durationValue} onChange={e=>upd("durationValue",parseFloat(e.target.value)||1)}/>
              </div>
              <div>
                <Label required>Unit</Label>
                <Sel value={resource.durationUnit} onChange={e=>upd("durationUnit",e.target.value)}>
                  {DURATION_UNITS.map(u=><option key={u}>{u}</option>)}
                </Sel>
              </div>
              <div className="flex items-end pb-1">
                <span className="text-sm text-slate-500">= <span className="font-bold" style={{color:"#00008B"}}>{calc.weeks.toFixed(2)} weeks</span></span>
              </div>
            </>
          )}
          <div className="sm:col-span-2 lg:col-span-3">
            <Label>Notes / Assumptions</Label>
            <Txta value={resource.notes} rows={2} onChange={e=>upd("notes",e.target.value)} placeholder="Seniority level, vendor, scope assumptions, caveats…"/>
          </div>
          <div className="sm:col-span-2 lg:col-span-3 bg-slate-50 rounded-xl px-4 py-3 grid grid-cols-2 sm:grid-cols-4 gap-3 text-center mt-1">
            {[["Duration",`${calc.weeks.toFixed(2)} wks`],["Hrs / Person",fmtNum(Math.round(calc.hoursPerResource))],
              ["Total Hours",fmtNum(Math.round(calc.totalHours))],["Total Role Cost",fmt(calc.totalCost,currency)]].map(([l,v],i)=>(
              <div key={l}>
                <p className="text-xs text-slate-500 mb-0.5">{l}</p>
                <p className={`text-sm font-semibold ${i===3?"":"text-slate-800"}`} style={i===3?{color:"#00008B"}:{}}>{v}</p>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ── APP ────────────────────────────────────────────────────────────────────────
function App() {
  const [project, setProject] = useState(() => {
    try { const s=localStorage.getItem("prbb_proj"); return s?JSON.parse(s):defaultProject; } catch { return defaultProject; }
  });
  const [resources, setResources] = useState(() => {
    try { const s=localStorage.getItem("prbb_res"); return s?JSON.parse(s):[]; } catch { return []; }
  });
  const [integrationHub, setIntegrationHub] = useState(() => {
    try { return localStorage.getItem("prbb_integ")==="true"; } catch { return false; }
  });
  const [exportMsg, setExportMsg] = useState("");
  const [confirmReset, setConfirmReset] = useState(false);

  useEffect(() => {
    try {
      localStorage.setItem("prbb_proj", JSON.stringify(project));
      localStorage.setItem("prbb_res",  JSON.stringify(resources));
      localStorage.setItem("prbb_integ", String(integrationHub));
    } catch {}
  }, [project, resources, integrationHub]);

  const projectWeeks    = toWeeks(project.durationValue, project.durationUnit);
  const errors          = validate(project, resources);
  const canExport       = errors.length === 0;
  const resourceCost    = useMemo(()=>resources.reduce((s,r)=>s+calcResource(r,projectWeeks).totalCost,0),[resources,projectWeeks]);
  const integCost       = integrationHub ? INTEGRATION_HUB_COST : 0;
  const totalCost       = resourceCost + integCost;
  const totalHours      = useMemo(()=>resources.reduce((s,r)=>s+calcResource(r,projectWeeks).totalHours,0),[resources,projectWeeks]);
  const totalHeadcount  = useMemo(()=>resources.reduce((s,r)=>s+(r.quantity||0),0),[resources]);

  function updProj(f,v) { setProject(p=>({...p,[f]:v})); }
  function addResource()      { setResources(rs=>[...rs,defaultResource()]); }
  function updateResource(id,u){ setResources(rs=>rs.map(r=>r.id===id?u:r)); }
  function duplicateResource(id){ setResources(rs=>{const i=rs.findIndex(r=>r.id===id);if(i===-1)return rs;const c={...rs[i],id:genId()};return [...rs.slice(0,i+1),c,...rs.slice(i+1)];}); }
  function deleteResource(id) { setResources(rs=>rs.filter(r=>r.id!==id)); }
  function handleReset() {
    setProject(defaultProject); setResources([]); setIntegrationHub(false); setConfirmReset(false);
    try { localStorage.removeItem("prbb_proj"); localStorage.removeItem("prbb_res"); localStorage.removeItem("prbb_integ"); } catch {}
  }
  function handleExport() {
    if (!canExport) return;
    try {
      const fn = exportToExcel(project, resources, integrationHub);
      setExportMsg(`✓ Exported: ${fn}`);
      setTimeout(()=>setExportMsg(""),6000);
    } catch(e) {
      setExportMsg("Export failed — please try again.");
      setTimeout(()=>setExportMsg(""),4000);
    }
  }

  const roleBreakdown = useMemo(()=>{
    const map={};
    resources.forEach(r=>{
      const k=r.role==="Other"?(r.customRole||"Other"):r.role; if(!k)return;
      if(!map[k])map[k]={quantity:0,totalHours:0,totalCost:0};
      const c=calcResource(r,projectWeeks);
      map[k].quantity+=(r.quantity||0); map[k].totalHours+=c.totalHours; map[k].totalCost+=c.totalCost;
    });
    return Object.entries(map);
  },[resources,projectWeeks]);

  return (
    <div className="min-h-screen bg-slate-50 font-sans">

      {/* ── HEADER ── */}
      <header className="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
        <div className="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4 flex-wrap">
          <div className="flex items-center gap-4">
            <MarsLogo size="sm" />
            <div className="h-8 w-px bg-slate-200"/>
            <div>
              <p className="text-sm font-bold text-slate-900 leading-tight">Resource Budget Builder</p>
              <p className="text-xs text-slate-500 hidden sm:block">Tech Lead estimation tool</p>
            </div>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            {confirmReset ? (
              <div className="flex items-center gap-2">
                <span className="text-xs text-slate-600">Reset everything?</span>
                <button onClick={handleReset} className="text-xs text-white px-3 py-1.5 rounded-lg font-medium transition" style={{background:"#CC0000"}}>Yes, reset</button>
                <button onClick={()=>setConfirmReset(false)} className="text-xs text-slate-500 hover:text-slate-700 px-2 py-1.5 transition">Cancel</button>
              </div>
            ) : (
              <button onClick={()=>setConfirmReset(true)} className="flex items-center gap-1.5 text-xs text-slate-500 hover:text-slate-700 px-3 py-1.5 rounded-lg hover:bg-slate-100 transition font-medium">
                <IcoReset/>Reset
              </button>
            )}
            <button onClick={handleExport} disabled={!canExport}
              className={`flex items-center gap-1.5 text-xs font-semibold px-4 py-1.5 rounded-lg transition shadow-sm ${canExport?"text-white hover:opacity-90":"bg-slate-200 text-slate-400 cursor-not-allowed"}`}
              style={canExport?{background:"#00008B"}:{}}>
              <IcoDl/>Export to Excel
            </button>
          </div>
        </div>
      </header>

      {/* ── HERO BANNER ── */}
      <div className="mars-gradient text-white">
        <div className="max-w-6xl mx-auto px-4 sm:px-6 py-6 flex items-start justify-between gap-6 flex-wrap">
          <div className="flex-1 min-w-0">
            <p className="text-xs font-semibold uppercase tracking-widest text-blue-300 mb-1">Mars Petcare · Technology</p>
            <h1 className="text-xl sm:text-2xl font-black tracking-tight leading-tight mb-2">Resource Budget Builder</h1>
            <p className="text-sm text-blue-100 leading-relaxed max-w-2xl">
              A tool for Tech Leads to estimate the people, time, and cost required for a technology initiative.
              Define your team composition, enter hourly rates and engagement duration, and instantly generate
              a professional budget you can share with stakeholders or export to Excel.
            </p>
          </div>
          <div className="flex-shrink-0 hidden sm:flex flex-col items-end gap-1 text-right">
            <p className="text-xs text-blue-300 uppercase tracking-widest">Total Estimated Cost</p>
            <p className="text-3xl font-black tracking-tight">{fmt(totalCost, project.currency)}</p>
            <p className="text-xs text-blue-300">{totalHeadcount} {totalHeadcount===1?"person":"people"} · {fmtNum(Math.round(totalHours))} hours</p>
          </div>
        </div>
      </div>

      <main className="max-w-6xl mx-auto px-4 sm:px-6 py-8 space-y-6">
        {/* Export message */}
        {exportMsg && (
          <div className={`flex items-center gap-2 px-4 py-3 rounded-xl text-sm font-medium ${exportMsg.startsWith("✓")?"bg-emerald-50 border border-emerald-200 text-emerald-700":"bg-red-50 border border-red-200 text-red-700"}`}>
            {exportMsg.startsWith("✓")&&<IcoCheck/>}{exportMsg}
          </div>
        )}
        {errors.length>0 && (resources.length>0 || !project.projectName || !project.team) && (
          <div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3">
            <p className="text-xs font-semibold text-amber-800 mb-1.5">Complete the following before exporting:</p>
            <ul className="space-y-0.5">{errors.map((e,i)=><li key={i} className="text-xs text-amber-700 flex items-start gap-1"><span className="opacity-50 mt-0.5">·</span>{e}</li>)}</ul>
          </div>
        )}

        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
          {/* ── LEFT: FORMS ── */}
          <div className="lg:col-span-2 space-y-6">

            {/* Project Information */}
            <Card>
              <SectionTitle sub="Basic details about the initiative.">Project Information</SectionTitle>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div className="sm:col-span-2">
                  <Label required>Project / Initiative Name</Label>
                  <Inp type="text" value={project.projectName} onChange={e=>updProj("projectName",e.target.value)} placeholder="Enter the project or initiative name"/>
                </div>
                <div>
                  <Label required>Team</Label>
                  <Sel value={project.team} onChange={e=>updProj("team",e.target.value)}>
                    <option value="">— Select team —</option>
                    {TEAMS.map(t=><option key={t}>{t}</option>)}
                  </Sel>
                </div>
                <div>
                  <Label>Currency</Label>
                  <Sel value={project.currency} onChange={e=>updProj("currency",e.target.value)}>
                    {CURRENCIES.map(c=><option key={c}>{c}</option>)}
                  </Sel>
                </div>
                <div>
                  <Label>Vendor / Delivery Partner</Label>
                  <Inp type="text" value={project.vendorName} onChange={e=>updProj("vendorName",e.target.value)} placeholder="Enter the vendor or delivery partner"/>
                </div>
                <div>
                  <Label>Project Start Date</Label>
                  <Inp type="date" value={project.startDate} onChange={e=>updProj("startDate",e.target.value)}/>
                </div>
                <div className="sm:col-span-2">
                  <Label>Project Description</Label>
                  <Txta value={project.description} onChange={e=>updProj("description",e.target.value)} placeholder="Brief summary of the project scope and objectives…"/>
                </div>
              </div>
            </Card>

            {/* Project Duration */}
            <Card>
              <SectionTitle sub="Sets the default duration applied to all resources unless overridden.">Project Duration</SectionTitle>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 items-end">
                <div>
                  <Label required>Duration</Label>
                  <Inp type="number" min={0.5} step="0.5" value={project.durationValue} onChange={e=>updProj("durationValue",parseFloat(e.target.value)||1)}/>
                </div>
                <div>
                  <Label required>Unit</Label>
                  <Sel value={project.durationUnit} onChange={e=>updProj("durationUnit",e.target.value)}>
                    {DURATION_UNITS.map(u=><option key={u}>{u}</option>)}
                  </Sel>
                </div>
                <div className="col-span-2">
                  <div className="rounded-xl px-4 py-3 text-center" style={{background:"#E8EEF7",border:"1px solid #C5D0E8"}}>
                    <p className="text-xs font-medium mb-0.5" style={{color:"#00008B"}}>Total duration</p>
                    <p className="text-xl font-black" style={{color:"#00008B"}}>{projectWeeks.toFixed(2)} <span className="text-sm font-medium">weeks</span></p>
                    <p className="text-xs mt-0.5" style={{color:"#5570A0"}}>{project.durationValue} {project.durationUnit} × {project.durationUnit==="months"?"4.33":"1"}</p>
                  </div>
                </div>
              </div>
            </Card>

            {/* Resource Planning */}
            <Card>
              <div className="flex items-start justify-between mb-5 gap-3">
                <div>
                  <h2 className="text-base font-bold text-slate-800 tracking-tight">Resource Planning</h2>
                  <p className="text-xs text-slate-500 mt-0.5">Define each role, headcount, rate, and hours.</p>
                </div>
                <button onClick={addResource}
                  className="flex-shrink-0 flex items-center gap-1.5 text-sm font-semibold text-white px-4 py-2 rounded-xl transition shadow-sm hover:opacity-90"
                  style={{background:"#00008B"}}>
                  <IcoPlus/>Add Resource
                </button>
              </div>
              {resources.length===0 ? (
                <div className="border-2 border-dashed border-slate-200 rounded-xl p-10 text-center">
                  <svg className="w-10 h-10 text-slate-300 mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.5}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                  </svg>
                  <p className="text-sm font-semibold text-slate-500">No resources added yet</p>
                  <p className="text-xs text-slate-400 mt-1 mb-5">Add roles to build your resource plan and estimate costs.</p>
                  <button onClick={addResource}
                    className="inline-flex items-center gap-1.5 text-sm font-semibold text-white px-5 py-2.5 rounded-xl transition shadow-sm hover:opacity-90"
                    style={{background:"#00008B"}}>
                    <IcoPlus/>Add your first resource
                  </button>
                </div>
              ) : (
                <div className="space-y-3">
                  {resources.map((r,i)=>(
                    <ResourceRow key={r.id} resource={r} index={i} projectWeeks={projectWeeks} currency={project.currency}
                      onUpdate={u=>updateResource(r.id,u)} onDuplicate={()=>duplicateResource(r.id)} onDelete={()=>deleteResource(r.id)}/>
                  ))}
                  <button onClick={addResource}
                    className="w-full flex items-center justify-center gap-1.5 text-sm text-slate-500 hover:text-blue-900 border border-dashed border-slate-300 hover:border-blue-800 rounded-xl py-3 transition font-medium">
                    <IcoPlus/>Add another resource
                  </button>
                </div>
              )}
            </Card>

            {/* ── INTEGRATION HUB ── */}
            <Card>
              <div className="flex items-start gap-3 mb-4">
                <div className="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5" style={{background:"#E8EEF7"}}>
                  <svg className="w-4 h-4" style={{color:"#00008B"}} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                  </svg>
                </div>
                <div>
                  <h2 className="text-base font-bold text-slate-800">Integration Hub</h2>
                  <p className="text-xs text-slate-500 mt-0.5">Does this initiative require any system integrations?</p>
                </div>
              </div>
              <Toggle
                checked={integrationHub}
                onChange={setIntegrationHub}
                label="Integration Hub team is required"
                sublabel="A standard estimate of €20,000 will be added to the total budget. This covers the Integration Hub team's involvement prior to product discovery. The estimate will be refined in a later phase."
              />
              {integrationHub && (
                <div className="mt-4 rounded-xl px-4 py-3 flex items-center justify-between gap-4" style={{background:"#E8EEF7",border:"1px solid #C5D0E8"}}>
                  <div className="flex items-center gap-2">
                    <IcoInfo/>
                    <div>
                      <p className="text-xs font-semibold" style={{color:"#00008B"}}>Integration Hub cost added</p>
                      <p className="text-xs text-slate-500">Standard estimate · pending discovery</p>
                    </div>
                  </div>
                  <p className="text-base font-black flex-shrink-0" style={{color:"#00008B"}}>{fmt(INTEGRATION_HUB_COST, project.currency)}</p>
                </div>
              )}
            </Card>
          </div>

          {/* ── RIGHT: SUMMARY ── */}
          <div className="space-y-5 lg:sticky lg:top-20">
            {/* Hero cost */}
            <div className="rounded-2xl p-6 text-white shadow-lg mars-gradient">
              <p className="text-xs font-semibold uppercase tracking-widest mb-2" style={{color:"#93A8D4"}}>Total Estimated Cost</p>
              <p className="text-4xl font-black tracking-tight leading-none mb-2">{fmt(totalCost,project.currency)}</p>
              <div className="flex flex-wrap gap-x-3 gap-y-1 text-xs" style={{color:"#93A8D4"}}>
                <span>{project.currency}</span><span>·</span>
                <span>{fmtNum(Math.round(totalHours))} hours</span><span>·</span>
                <span>{totalHeadcount} {totalHeadcount===1?"person":"people"}</span>
              </div>
              {integrationHub && (
                <div className="mt-3 pt-3 border-t border-white border-opacity-20 text-xs" style={{color:"#93A8D4"}}>
                  Includes {fmt(INTEGRATION_HUB_COST, project.currency)} Integration Hub estimate
                </div>
              )}
            </div>

            {/* Project summary */}
            <Card>
              <SectionTitle>Project Summary</SectionTitle>
              <dl className="space-y-2.5 text-sm">
                {[
                  ["Project", project.projectName||<span className="text-slate-400 italic text-xs">Not entered</span>],
                  ["Team", project.team
                    ? <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold border" style={{background:"#E8EEF7",color:"#00008B",borderColor:"#C5D0E8"}}>{project.team}</span>
                    : <span className="text-slate-400 italic text-xs">Not selected</span>],
                  ["Vendor", project.vendorName||"—"],
                  ["Duration", `${project.durationValue} ${project.durationUnit} (${projectWeeks.toFixed(2)} wks)`],
                  ["Start Date", project.startDate||"—"],
                  ["Roles", resources.length],
                  ["Headcount", totalHeadcount],
                  ["Total Hours", fmtNum(Math.round(totalHours))],
                  ["Integration Hub", integrationHub
                    ? <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold border" style={{background:"#E8EEF7",color:"#00008B",borderColor:"#C5D0E8"}}>Yes — {fmt(INTEGRATION_HUB_COST,project.currency)}</span>
                    : <span className="text-slate-400 text-xs">Not required</span>],
                ].map(([k,v])=>(
                  <div key={k} className="flex justify-between items-start gap-2">
                    <dt className="text-slate-500 flex-shrink-0">{k}</dt>
                    <dd className="text-right font-medium text-slate-800">{v}</dd>
                  </div>
                ))}
              </dl>
            </Card>

            {/* Cost by role */}
            {roleBreakdown.length>0 && (
              <Card>
                <SectionTitle>Cost by Role</SectionTitle>
                <div className="overflow-x-auto -mx-1">
                  <table className="w-full text-xs">
                    <thead>
                      <tr className="border-b border-slate-100">
                        <th className="text-left text-slate-500 font-semibold pb-2 px-1">Role</th>
                        <th className="text-right text-slate-500 font-semibold pb-2 px-1">Qty</th>
                        <th className="text-right text-slate-500 font-semibold pb-2 px-1">Hrs</th>
                        <th className="text-right text-slate-500 font-semibold pb-2 px-1">Cost</th>
                      </tr>
                    </thead>
                    <tbody>
                      {roleBreakdown.map(([role,d])=>(
                        <tr key={role} className="border-b border-slate-50 hover:bg-slate-50 transition">
                          <td className="py-2 text-slate-700 pr-2 px-1 max-w-[100px] truncate" title={role}>{role}</td>
                          <td className="py-2 text-right text-slate-600 px-1">{d.quantity}</td>
                          <td className="py-2 text-right text-slate-600 px-1">{fmtNum(Math.round(d.totalHours))}</td>
                          <td className="py-2 text-right font-semibold text-slate-800 px-1">{fmt(d.totalCost,project.currency)}</td>
                        </tr>
                      ))}
                      {integrationHub && (
                        <tr className="border-b border-slate-50">
                          <td className="py-2 text-slate-500 italic px-1" colSpan={3}>Integration Hub</td>
                          <td className="py-2 text-right font-semibold text-slate-800 px-1">{fmt(INTEGRATION_HUB_COST,project.currency)}</td>
                        </tr>
                      )}
                    </tbody>
                    <tfoot>
                      <tr className="border-t-2 border-slate-200">
                        <td className="pt-2.5 font-bold text-slate-800 px-1">Total</td>
                        <td className="pt-2.5 text-right font-bold text-slate-800 px-1">{totalHeadcount}</td>
                        <td className="pt-2.5 text-right font-bold text-slate-800 px-1">{fmtNum(Math.round(totalHours))}</td>
                        <td className="pt-2.5 text-right font-bold px-1" style={{color:"#00008B"}}>{fmt(totalCost,project.currency)}</td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              </Card>
            )}

            {/* Export */}
            <Card>
              <SectionTitle>Export Budget</SectionTitle>
              {!canExport && errors.length>0 && (
                <div className="mb-3 bg-slate-50 rounded-lg px-3 py-2.5 text-xs text-slate-500 space-y-1">
                  {errors.slice(0,4).map((e,i)=><p key={i} className="flex gap-1"><span className="opacity-50">·</span>{e}</p>)}
                  {errors.length>4 && <p className="opacity-60">…and {errors.length-4} more</p>}
                </div>
              )}
              <button onClick={handleExport} disabled={!canExport}
                className={`w-full flex items-center justify-center gap-2 text-sm font-semibold py-3 rounded-xl transition ${canExport?"text-white hover:opacity-90 shadow-sm":"bg-slate-100 text-slate-400 cursor-not-allowed"}`}
                style={canExport?{background:"#00008B"}:{}}>
                <IcoDl/>Generate Budget (.xlsx)
              </button>
              <p className="text-xs text-slate-400 mt-2.5 text-center leading-relaxed">
                Executive Summary · Resource Breakdown · Assumptions
              </p>
            </Card>
          </div>
        </div>
      </main>

      <footer className="mt-12 border-t border-slate-200 py-5">
        <div className="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between gap-4 flex-wrap">
          <MarsLogo size="sm"/>
          <p className="text-xs text-slate-400">Resource Budget Builder · Internal tool · Progress auto-saved · No server required</p>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
